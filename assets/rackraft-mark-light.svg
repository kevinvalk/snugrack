  :root.dark .rr-body-shade { fill: url(#rr-metal-dark); }
  :root.dark .rr-top-shade { fill: url(#rr-top-dark); }
  :root.dark .rr-fold-shade { fill: url(#rr-fold-dark); }
  :root.dark .rr-leg-shade { fill: url(#rr-leg-dark); }
  :root.dark .rr-wordmark { fill: #F4F7FB; }
  /* With an external SVG image, media dimensions use the image viewport. */
  @media (max-height: 31px) {
