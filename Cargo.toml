[package]
name = "rackraft"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
glam = "0.34"
i_overlay = "9"
serde = { version = "1", features = ["derive"] }
spade = "2"
tsify = "0.5.8"
wasm-bindgen = "0.2"

[profile.release]
lto = true
